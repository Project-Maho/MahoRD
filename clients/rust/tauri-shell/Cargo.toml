[package]
name = "tauri-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.cargo-all-features]
skip = true

[build-dependencies]
tauri-build = { version = "2", default-features = false , features = [] }

[dependencies]
maho-app = { path = "../maho-app" }
maho-decode = { path = "../maho-decode", features = ["ffmpeg"] }
maho-host = { path = "../maho-host" }
maho-net = { path = "../maho-net" }
maho-proto = { path = "../maho-proto" }
maho-render = { path = "../maho-render" }
tauri = { version = "2", default-features = false, features = ["wry", "tray-icon"] }
tauri-plugin-autostart = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.1", default-features = false, features = ["NSPasteboard", "NSBitmapImageRep", "NSImageRep"] }
objc2-foundation = { version = "0.3.1", default-features = false, features = ["NSData", "NSDictionary", "NSString", "NSArray"] }

[lib]
name = "tauri_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src-tauri/src/lib.rs"

[[bin]]
name = "tauri-shell"
path = "src-tauri/src/main.rs"
