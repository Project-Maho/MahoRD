[package]
name = "maho-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "maho_host"
path = "src/lib.rs"

[[bin]]
name = "maho-host"
path = "src/main.rs"

[features]
default = []
macos-host = []

[dependencies]
maho-proto = { path = "../maho-proto" }
maho-net = { path = "../maho-net" }
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
openssl.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
hostname = "0.4"
dirs = "6"
libc = "0.2"
rustix.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
ffmpeg-next = { workspace = true, default-features = false, features = ["format", "software-scaling"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-screen-capture-kit = { version = "0.3", features = ["block2", "dispatch2", "objc2-core-media"] }
objc2-core-media = { version = "0.3", features = ["CMBlockBuffer", "CMSampleBuffer", "objc2-core-video"] }
objc2-core-video = { version = "0.3", features = ["CVPixelBuffer"] }
objc2-core-foundation = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
core-graphics = { version = "0.25", features = ["elcapitan", "highsierra"] }
core-foundation = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
tempfile = "3"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = { version = "5.4.1", features = ["std"] }
dxgi-capture-rs = "1.2.2"
nvenc = "0.1.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Environment",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
maho-app = { path = "../maho-app" }
